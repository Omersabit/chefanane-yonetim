<!DOCTYPE html>
<html lang="tr">
  <head>
    <!-- Web yonetim ekrani sablonu (R78). Expo `public/index.html`'i SPA sablonu olarak kullanir. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Yonetim ekrani arama motorlarina kapali. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!--
      Icerik guvenlik politikasi (R78, proje sahibinin karari 2026-10-09): kod yalnizca bu
      siteden calisir, veri yalnizca Supabase'e gider, cerceve yalnizca YouTube oynaticisi.
      Supabase adresi yer tutucusu derlemede EXPO_PUBLIC_SUPABASE_URL ile degistirilir
      (.github/workflows/web-staging-deploy.yml); degismezse Supabase istekleri engellenir.
      GitHub Pages baslik gonderemedigi icin meta etiketidir (frame-ancestors desteklenmez).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mzlppanwrpkyiyxanbow.supabase.co https://i.ytimg.com; font-src 'self' data:; connect-src 'self' https://mzlppanwrpkyiyxanbow.supabase.co blob: data:; frame-src https://www.youtube-nocookie.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Chefanane Yönetim</title>
    <!-- Tema (2026-10-19): ilk karede zemin kayitli secime / sistem temasina gore (theme-boot.js). -->
    <meta name="color-scheme" content="light dark" />
    <script src="/theme-boot.js"></script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /*
        Zemin yalnizca <html>'de: betik calismazsa yedek olarak sistem temasi (gunduz #F3EFE6,
        gece #151210; config/theme.ts). Betik ve uygulama <html> satir ici stiliyle bunu ezer.
      */
      html {
        background-color: #f3efe6;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #151210;
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

</body>
</html>
